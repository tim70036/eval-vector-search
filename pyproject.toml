[project]
name = "eval-gvm-vector-search"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mlflow[databricks]==3.4.0",
    "databricks-sdk>=0.78.0",
    "databricks-vectorsearch>=0.63",
    "pandas>=2.3.3",
    "pydantic-settings>=2.12.0",
    "pydantic>=2.12.5",
    "loguru>=0.7.0",
    "requests>=2.32.0",
    "google-genai>=1.60.0",
]

[project.scripts]
eval-vector-search = "eval_gvm_vector_search.cli:main"

[tool.uv]
dev-dependencies = [
    "pytest>=9.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_gvm_vector_search"]
